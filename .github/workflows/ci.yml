name: CI

# Catch type errors, missing files, and failing tests before Cloud Build deploys.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: typecheck · build · tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static release gates
        run: npm run audit:launch

      - name: Typecheck
        run: npm run typecheck

      # Mirrors the Cloud Build step; fails fast on missing imports (e.g. a file that was never committed).
      - name: Build (vite + esbuild)
        run: npm run build

      - name: Tests
        run: npm run test:ci
