<!doctype html>
<!--
  صفحة «نُحدّث البرنامج».

  أثناء النشر يتبدّل الخادم، فتجيب واجهةُ Google الأماميّة عن التنقّل بصفحة خطأٍ
  إنجليزية لا يكتبها خادمُنا أصلاً. عاملُ الخدمة (public/sw.js) يحفظ هذه الصفحة
  وسكربتها (/updating.js) عند تثبيته، ويقدّمها بدلاً من أيّ جوابٍ 500/502/503/504
  أو انقطاعٍ للتنقّل — والرابطُ في شريط العنوان يبقى ما طلبه الزائر، فإعادةُ
  التحميل تفتحه هو نفسه.

  مستقلّةٌ تماماً: لا طلبَ خارجياً، والخطُّ خطُّ البرنامج المستضاف ذاتياً وإلا خطُّ
  النظام. والسكربت ملفٌّ خارجي لا مضمّن، لأن سياسة CSP في الخادم تمنع السكربت
  المضمّن. يسأل /api/health/live كل ثلاث ثوانٍ (ويتباطأ تدريجياً)، فإذا أجاب أعاد
  فتح الصفحة المطلوبة، ولا يدور في حلقة.
-->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#edf0f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1220" media="(prefers-color-scheme: dark)">
<title>نُحدّث البرنامج · AcademicOS</title>
<script src="/updating.js"></script>
<style>
@font-face{font-family:"IBM Plex Sans Arabic";font-weight:400;font-display:swap;src:local("IBM Plex Sans Arabic"),url("/fonts/plex-ar-arabic-400.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Sans Arabic";font-weight:600;font-display:swap;src:local("IBM Plex Sans Arabic SemiBold"),url("/fonts/plex-ar-arabic-600.woff2") format("woff2")}
:root{
  --bg:#edf0f6;--ink:#131a33;--muted:#565d78;--line:rgb(19 26 51 / .11);
  --accent:#23346b;--glow:rgba(35,52,107,.13);--glow-2:rgba(200,69,45,.08);--scan:#23346b;
  --spark:#c8452d;--spark-2:#7f92d8;
  --button:#fcfdff;--button-line:rgb(19 26 51 / .15);--shadow:rgba(23,35,77,.28);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not(.light){
    --bg:#0f1220;--ink:#eceefa;--muted:#a0a5c2;--line:rgb(255 255 255 / .09);
    --accent:#a6b6f7;--glow:rgba(166,182,247,.12);--glow-2:rgba(240,132,98,.07);--scan:#a6b6f7;
    --spark:#f08462;--spark-2:#a6b6f7;
    --button:#161a2e;--button-line:rgb(255 255 255 / .14);--shadow:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root.dark{
  --bg:#0f1220;--ink:#eceefa;--muted:#a0a5c2;--line:rgb(255 255 255 / .09);
  --accent:#a6b6f7;--glow:rgba(166,182,247,.12);--glow-2:rgba(240,132,98,.07);--scan:#a6b6f7;
  --spark:#f08462;--spark-2:#a6b6f7;
  --button:#161a2e;--button-line:rgb(255 255 255 / .14);--shadow:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
html{background:var(--bg)}
body{
  margin:0;min-height:100%;display:grid;place-items:center;
  padding:max(24px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));
  background:radial-gradient(circle at 50% 40%,var(--glow),transparent 46%),radial-gradient(circle at 18% 92%,var(--glow-2),transparent 40%),var(--bg);
  color:var(--ink);
  font-family:"IBM Plex Sans Arabic",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Arabic",Tahoma,sans-serif;
  font-synthesis:none;-webkit-font-smoothing:antialiased;text-align:center;
}
main{display:grid;justify-items:center;gap:0;max-width:420px;width:100%}
.stage{position:relative;width:132px;height:132px;display:grid;place-items:center;margin-bottom:30px}
.halo{position:absolute;inset:0;width:100%;height:100%;animation:turn 3.6s linear infinite}
.halo circle{fill:none;stroke-width:2;stroke-linecap:round}
.halo .track{stroke:var(--line)}
.halo .arc{stroke:var(--accent);stroke-dasharray:96 400;opacity:.85}
.mark{width:84px;height:84px;display:block;filter:drop-shadow(0 18px 30px var(--shadow))}
.mark .bar{transform-box:fill-box;transform-origin:50% 50%;animation:breathe 2.4s cubic-bezier(.45,0,.25,1) infinite}
.mark .dot{transform-box:fill-box;transform-origin:50% 50%;animation:settle 2.4s cubic-bezier(.16,1,.3,1) infinite}
.spark{position:absolute;fill:var(--spark);animation:twinkle 2.4s ease-in-out infinite}
.spark.one{width:20px;height:20px;top:6px;inset-inline-start:8px}
.spark.two{width:12px;height:12px;bottom:14px;inset-inline-end:6px;fill:var(--spark-2);animation-delay:1.2s}
h1{margin:0;font-size:clamp(22px,5.6vw,27px);font-weight:600;line-height:1.5;letter-spacing:0}
.lead{margin:6px 0 0;font-size:16px;line-height:1.7;color:var(--muted)}
.pulse{width:132px;height:2px;margin:26px 0 28px;border-radius:99px;background:var(--line);overflow:hidden}
.pulse i{display:block;width:36%;height:100%;border-radius:inherit;background:linear-gradient(90deg,transparent,var(--scan),transparent);animation:scan 1.5s ease-in-out infinite}
button{
  min-height:44px;padding:0 22px;border-radius:12px;cursor:pointer;
  border:1px solid var(--button-line);background:var(--button);color:var(--ink);
  font:inherit;font-size:14px;font-weight:600;
  transition:border-color .2s ease,transform .2s ease;
}
button:hover{border-color:var(--accent)}
button:active{transform:scale(.98)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.note{min-height:20px;margin:14px 0 0;font-size:12.5px;line-height:1.6;color:var(--muted)}
@keyframes turn{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.62)}}
@keyframes settle{0%{transform:translateY(-5px) scale(.8);opacity:.55}45%,100%{transform:none;opacity:1}}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.7) rotate(0)}50%{opacity:1;transform:scale(1) rotate(20deg)}}
@keyframes scan{0%{transform:translateX(130%)}100%{transform:translateX(-360%)}}
@media (prefers-reduced-motion:reduce){
  .halo,.mark .bar,.mark .dot,.spark,.pulse i{animation:none}
  .spark{opacity:.8}
}
</style>
</head>
<body>
<main>
  <div class="stage" aria-hidden="true">
    <svg class="halo" viewBox="0 0 132 132" focusable="false"><circle class="track" cx="66" cy="66" r="63"/><circle class="arc" cx="66" cy="66" r="63"/></svg>
    <!-- علامة AcademicOS نفسها (public/icon.svg): بلاطةٌ نيلية، حرفُ A، ونقطةُ الزنجفر. -->
    <svg class="mark" viewBox="0 0 48 48" focusable="false">
      <defs><linearGradient id="updatingTile" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#23346b"/><stop offset="100%" stop-color="#17234d"/></linearGradient></defs>
      <rect width="48" height="48" rx="11" fill="url(#updatingTile)"/>
      <g fill="none" stroke="#fcfdff" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.6 34.6 L24 13.4 L33.4 34.6" stroke-width="3.7"/>
        <path class="bar" d="M17.7 27.6 H30.3" stroke-width="3.1"/>
      </g>
      <circle class="dot" cx="37.4" cy="11.6" r="3.2" fill="#c8452d"/>
    </svg>
    <svg class="spark one" viewBox="0 0 24 24" focusable="false"><path d="M12 0c.7 6.4 5.6 11.3 12 12-6.4.7-11.3 5.6-12 12-.7-6.4-5.6-11.3-12-12C6.4 11.3 11.3 6.4 12 0z"/></svg>
    <svg class="spark two" viewBox="0 0 24 24" focusable="false"><path d="M12 0c.7 6.4 5.6 11.3 12 12-6.4.7-11.3 5.6-12 12-.7-6.4-5.6-11.3-12-12C6.4 11.3 11.3 6.4 12 0z"/></svg>
  </div>
  <h1 id="title">نُحدّث البرنامج الآن ✨</h1>
  <p class="lead" id="lead">لحظاتٍ ونعود</p>
  <div class="pulse" aria-hidden="true"><i></i></div>
  <button type="button" id="retry">أعد المحاولة الآن</button>
  <p class="note" id="note" role="status" aria-live="polite">ستُفتح الصفحة التي طلبتها تلقائياً حين نعود.</p>
</main>
</body>
</html>
