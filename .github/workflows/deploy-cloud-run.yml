# ينشر AcademicOS إلى Cloud Run عند كل دفع إلى main.
#
# لماذا هذا الملف موجود:
#   المستودع يحمل سكربت نشر مكتملًا (`scripts/deploy-cloud-run.sh`) لكنه كان
#   يُشغَّل باليد فقط. فكل ما يُدمج في main يبقى في GitHub ولا يصل إلى الخدمة —
#   ومنه البيئة التجريبية: تُدمج، ولا تظهر على الموقع الحيّ أبدًا.
#
# والنشر يمرّ بالسكربت نفسه لا بأمرٍ مكتوبٍ هنا من جديد: هو يحمل قرارات
# لا يجوز أن تُفقد — يرفض النشر عبر المشاريع، ولا يخترع خدمةً ثانية، ويحافظ على
# متغيّرات Firebase، ويصلح صلاحيات الوصول بعد النشر. إعادة كتابته هنا كانت
# ستفقدها بصمت.

name: نشر AcademicOS إلى Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: academicos-deploy
  cancel-in-progress: false

# الوجهة مأخوذة من رابط الخدمة الحيّ نفسه:
#   academicos-app-522016905178.europe-west2.run.app
# أي الخدمة `academicos-app` في المشروع رقم 522016905178 (tebyan-clean-2026-5f13b)
# بمنطقة europe-west2 — لا `academicos` في مشروع academicos-3991f، فتلك خدمةٌ
# أخرى ونشرٌ عليها لا يغيّر شيئًا في الموقع الذي يفتحه الناس.
env:
  GCP_PROJECT_ID: tebyan-clean-2026-5f13b
  CLOUD_RUN_SERVICE_NAME: academicos-app
  CLOUD_RUN_REGION: europe-west2

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: تثبيت الحزم
        run: npm ci

      # لا نشر فوق فحصٍ أحمر: نفس بوابات ورك-فلو التحقق وبترتيبها.
      - name: تدقيق الإطلاق
        run: npm run audit:launch

      - name: فحص الأنواع
        run: npm run typecheck

      - name: البناء
        run: npm run build

      - name: الاختبارات
        run: npm run test:ci

      # إعدادٌ لمرة واحدة لم يُنفَّذ بعد ليس عطبًا في هذا التغيير: لا شيء انكسر، ولا
      # شيء يُصلَح في الشيفرة. و`exit 1` كان يضع علامةً حمراء على كل دمجٍ إلى الأبد،
      # فتفقد العلامة معناها ولا يُميَّز بعدها فشلٌ حقيقي حين يقع.
      #
      # فتقف المهمة وتقول لماذا — تنبيهٌ على صفحة التشغيل وملخّصٌ مقروء — ولا تدّعي
      # نشرًا لم يقع: كل خطوة بعدها مشروطة بأن الهوية مضبوطة.
      - name: التحقق من إعداد هوية النشر
        id: identity
        shell: bash
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          MISSING=""
          if [[ -z "$WIF_PROVIDER" ]]; then MISSING="$MISSING GCP_WORKLOAD_IDENTITY_PROVIDER"; fi
          if [[ -z "$DEPLOY_SERVICE_ACCOUNT" ]]; then MISSING="$MISSING GCP_DEPLOY_SERVICE_ACCOUNT"; fi
          if [[ -n "$MISSING" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=لم يُنشر شيء::هوية النشر غير مُعدّة بعد. الخطوات في docs/deploy-academicos.md"
            {
              echo "## لم يُنشر شيء — والتغيير سليم"
              echo ""
              echo "الفحوص مرّت، ولم يُنشر شيء لأن **هوية النشر غير مُعدّة بعد**."
              echo "هذا إعدادٌ لمرة واحدة على صاحب المستودع، لا عطبٌ في هذا التغيير."
              echo ""
              echo "الناقص:$MISSING"
              echo ""
              echo "الخطوات في \`docs/deploy-academicos.md\`، ثم تُضاف القيم في:"
              echo "Settings → Secrets and variables → Actions → **Variables**"
              echo ""
              echo "وبمجرد إضافتها يمضي النشر تلقائيًا عند الدمج التالي بلا تعديلٍ هنا."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: مصادقة Google Cloud بلا مفتاح دائم
        if: steps.identity.outputs.configured == 'true'
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        if: steps.identity.outputs.configured == 'true'
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      # اسم الخدمة والمنطقة يُمرَّران صراحةً: السكربت يستطيع استنتاجهما، لكنه
      # يرفض حين يجد أكثر من مرشّح — والتصريح هنا يمنع مفاجأةً في مشروعٍ نمت فيه
      # خدمةٌ ثانية لاحقًا.
      - name: النشر عبر سكربت المستودع
        if: steps.identity.outputs.configured == 'true'
        shell: bash
        env:
          CLOUD_RUN_PROJECT_ID: ${{ env.GCP_PROJECT_ID }}
          CLOUD_RUN_SERVICE_NAME: ${{ env.CLOUD_RUN_SERVICE_NAME }}
          CLOUD_RUN_REGION: ${{ env.CLOUD_RUN_REGION }}
          # الخدمة تعمل في مشروعٍ غير مشروع Firebase (هكذا نشرها AI Studio)،
          # والسكربت يرفض ذلك افتراضًا حمايةً من نشرٍ عابرٍ بالخطأ. وهنا مقصود
          # ومطابقٌ للواقع القائم، فيُصرَّح به بدل تعطيل الحارس.
          ALLOW_CROSS_PROJECT_FIREBASE: "true" 
        run: npm run deploy:cloudrun

      - name: التحقق أن الخدمة تردّ بعد النشر
        if: steps.identity.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          URL="$(gcloud run services describe "$CLOUD_RUN_SERVICE_NAME" \
                  --project "$GCP_PROJECT_ID" --region "$CLOUD_RUN_REGION" \
                  --format='value(status.url)')"
          echo "URL: $URL"
          CODE="$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$URL/")"
          echo "HTTP $CODE"
          # نشرٌ ينتهي بخدمةٍ لا تردّ ليس نشرًا ناجحًا، وإن قال gcloud إنه تمّ.
          [[ "$CODE" =~ ^(200|30[0-9])$ ]] || { echo "الخدمة لا تردّ بعد النشر." >&2; exit 1; }
          # الصفحة تردّ حتى لو انقطع Firestore؛ تسجيل الدخول والمشاريع لا. فيُفحص الوصول نفسه.
          PROBE="$(curl -s --max-time 30 "$URL/api/health/firestore" || true)"
          echo "Firestore: $PROBE"
          [[ "$PROBE" == *'"ok":true'* ]] || { echo "الخدمة لا تصل إلى Firestore — راجع docs/deploy-academicos.md (إصلاح الصلاحيات)." >&2; exit 1; }
